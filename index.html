<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>三茶パティオ 設営図</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />

        <style>
            @font-face{font-family:'Jost';src:url('fonts/Jost.ttf');font-weight:100 900}
            .staticrypt-html{height:100%}
            .staticrypt-body{height:100%;margin:0}
            .staticrypt-content{height:100%;background:#fff;color:#111;font-family:'Jost','Hiragino Sans',sans-serif;-webkit-font-smoothing:antialiased}
            .staticrypt-page{width:380px;max-width:92vw;padding:18vh 0 0;margin:auto;box-sizing:border-box}
            .staticrypt-form{background:#fff;padding:0;text-align:left}
            .staticrypt-instructions{margin:0 0 28px}
            .staticrypt-title{font-size:18px;font-weight:500;letter-spacing:.06em;margin:0 0 6px}
            .staticrypt-instructions p:not(.staticrypt-title){font-size:12px;color:#777;letter-spacing:.05em;margin:0;font-family:'Hiragino Sans',sans-serif}
            .staticrypt-hr{display:none}
            .staticrypt-password-container{position:relative;background:#fff;border:1px solid #111;margin:0 0 12px;box-sizing:border-box}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{background:transparent;border:0;outline:0;box-sizing:border-box;font-size:16px;padding:14px 44px 14px 14px;width:100%;color:#111;font-family:inherit;letter-spacing:.04em}
            .staticrypt-toggle-password-visibility{cursor:pointer;height:18px;width:18px;opacity:.5;padding:13px;position:absolute;right:0;top:50%;transform:translateY(-50%);filter:grayscale(1)}
            .staticrypt-form .staticrypt-decrypt-button{width:100%;border:1px solid #111;background:#111;color:#fff;padding:14px;font-size:12px;letter-spacing:.2em;font-weight:500;cursor:pointer;font-family:inherit;border-radius:0}
            .staticrypt-form .staticrypt-decrypt-button:hover,.staticrypt-form .staticrypt-decrypt-button:focus{background:#333;outline:0}
            label.staticrypt-remember{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:12px;color:#555;letter-spacing:.04em;font-family:'Hiragino Sans',sans-serif}
            .staticrypt-remember input[type="checkbox"]{accent-color:#111;margin:0;width:14px;height:14px}
            .hidden{display:none!important}
            .staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center}
            .staticrypt-spinner{display:inline-block;width:1.6rem;height:1.6rem;border:2px solid #ccc;border-right-color:transparent;border-radius:50%;animation:spinner-border .75s linear infinite}
            @keyframes spinner-border{100%{transform:rotate(360deg)}}
        </style>
    </head>
